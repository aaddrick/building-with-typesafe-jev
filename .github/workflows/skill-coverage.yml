name: skill coverage

# Asks Claude to bring the skill up to date with the latest cached TypeSafe
# docs and opens one pull request with the result. docs-cache.yml calls this
# when DOCS_LATEST is newer than DOCS_SKILL_REVIEWED; run it by hand to retry
# a failed run, or with force for a review against unchanged docs.
#
# The diff runs from the copy the skill was last reviewed against to the
# latest copy. While a pull request is open, a newer docs change is reviewed
# on top of its branch, from the copy its description records, so the branch
# collects every change until someone merges it. skill-reviewed.yml moves
# DOCS_SKILL_REVIEWED on merge. When Claude finds nothing to change and no
# pull request is open, this moves DOCS_SKILL_REVIEWED itself. The decisions
# live in scripts/docs_pipeline.py.
#
# Needs the ANTHROPIC_API_KEY secret and GH_PAT (Variables: read and write).
# A pull request that GITHUB_TOKEN opens does not start the checks workflow;
# give GH_PAT Contents and Pull requests: read and write too, and it is used
# for the push and the pull request. With only GITHUB_TOKEN for those, allow
# Actions to create pull requests under Settings > Actions > General.
on:
  workflow_call:
    inputs:
      latest:
        description: Ref of the docs copy to review against (defaults to DOCS_LATEST)
        type: string
        required: false
  workflow_dispatch:
    inputs:
      force:
        description: Run even when the skill is marked as reviewed against the latest docs
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: skill-coverage
  cancel-in-progress: false

env:
  LATEST: ${{ inputs.latest || vars.DOCS_LATEST }}
  REVIEWED: ${{ vars.DOCS_SKILL_REVIEWED }}
  SKILL: skills/building-with-typesafe-jev
  BRANCH: docs-sync/skill-coverage
  BASE_BRANCH: ${{ github.event.repository.default_branch }}
  # Claude reads the full docs here. .gitignore keeps it out of commits.
  DOCS: .docs-cache/llms-full.txt
  # Pinned like plugin-load-check.yml, so a CLI release changes this job only
  # on the commit that bumps the pin.
  CLAUDE_CODE_VERSION: "2.1.283"
  MODEL: ${{ vars.SKILL_COVERAGE_MODEL || 'claude-opus-5-5' }}
  MAX_BUDGET_USD: "8"

jobs:
  update-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A caller's github.sha is whatever its run started on.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether there is anything to review
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/docs_pipeline.py plan --latest "$LATEST" --reviewed "$REVIEWED" \
            --branch "$BRANCH" --force "${{ inputs.force || false }}"

      - name: Continue on the open pull request's branch
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.pr != ''
        run: python3 scripts/docs_pipeline.py use-branch --branch "$BRANCH" --base-branch "$BASE_BRANCH"

      - name: Fetch both copies and build the change report
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          python3 scripts/docs_pipeline.py prepare --latest "$LATEST" --base "${{ steps.plan.outputs.base }}" \
            --docs "$DOCS" --report "$RUNNER_TEMP/coverage/report.md" --skill "$SKILL"

      - name: Install Claude Code
        if: steps.plan.outputs.run == 'true'
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      # The prompt carries third-party docs text, so the toolset is an
      # explicit allowlist with no Bash: an injected instruction can edit
      # files, which the next step confines to the skill, but cannot run
      # commands or reach the API key. The prompt goes in on stdin because
      # one argv string caps at 128 KiB.
      - name: Ask Claude to update the skill
        if: steps.plan.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error::The ANTHROPIC_API_KEY secret is not set"
            exit 1
          fi
          cat .github/skill-coverage-prompt.md "$RUNNER_TEMP/coverage/report.md" > "$RUNNER_TEMP/coverage/prompt.md"

          if timeout 1800s claude -p \
              --allowedTools "Read,Grep,Glob,Edit,Write" \
              --output-format json \
              --model "$MODEL" \
              --max-budget-usd "$MAX_BUDGET_USD" \
              < "$RUNNER_TEMP/coverage/prompt.md" \
              > "$RUNNER_TEMP/coverage/claude.json" \
              2> "$RUNNER_TEMP/coverage/claude-stderr.log"; then
            :
          else
            code=$?
            echo "::error::claude exited $code"
            tail -n 50 "$RUNNER_TEMP/coverage/claude-stderr.log"
            exit 1
          fi

          jq -r '.result // empty' "$RUNNER_TEMP/coverage/claude.json" > "$RUNNER_TEMP/coverage/summary.md"
          jq -r '"Claude: \(.num_turns // "?") turns, $\(.total_cost_usd // "?")"' "$RUNNER_TEMP/coverage/claude.json"
          if [[ "$(jq -r '.is_error // false' "$RUNNER_TEMP/coverage/claude.json")" == "true" ]]; then
            echo "::error::Claude reported an error"
            cat "$RUNNER_TEMP/coverage/summary.md"
            exit 1
          fi
          cat "$RUNNER_TEMP/coverage/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Confine the edits to the skill
        if: steps.plan.outputs.run == 'true'
        run: |
          outside=$(git status --porcelain --untracked-files=all | cut -c4- | grep -v "^$SKILL/" || true)
          if [[ -n "$outside" ]]; then
            echo "::error::Claude changed files outside $SKILL:"
            echo "$outside"
            exit 1
          fi

      - name: Checks
        if: steps.plan.outputs.run == 'true'
        run: |
          python3 scripts/check_configs.py
          python3 -m unittest discover -s tests

      - name: Open or update the pull request, or record the review
        if: steps.plan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          VARS_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 scripts/docs_pipeline.py publish --latest "$LATEST" --pr "${{ steps.plan.outputs.pr }}" \
            --branch "$BRANCH" --base-branch "$BASE_BRANCH" --skill "$SKILL" \
            --summary "$RUNNER_TEMP/coverage/summary.md" --report "$RUNNER_TEMP/coverage/report.md" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Keep the run's files
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skill-coverage
          path: ${{ runner.temp }}/coverage/
          if-no-files-found: ignore

  # Inside a workflow_call, github.workflow is the caller's name, so a run
  # called from docs-cache leaves the alert to docs-cache and sends one email.
  alert:
    needs: update-skill
    if: failure() && github.workflow == 'skill coverage'
    uses: ./.github/workflows/failure-alert.yml
    secrets: inherit
