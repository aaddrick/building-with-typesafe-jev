name: docs cache

# Every 8 hours, fetch docs.typesafe.ai/llms-full.txt. When it differs from
# the last copy, keep the new one as an artifact of this run and point the
# DOCS_LATEST repository variable at it. When the skill was last reviewed
# against an older copy (DOCS_SKILL_REVIEWED), hand off to
# skill-coverage.yml, which asks Claude to update the skill and opens a pull
# request. Emails an alert when either job fails.
#
# The decisions live in scripts/docs_pipeline.py (tested in
# tests/test_docs_pipeline.py), which also documents the refs the two
# variables hold. Artifacts expire after 90 days, so a run re-uploads an
# unchanged copy once its artifact is within 14 days of expiring.
#
# Needs the GH_PAT secret: GITHUB_TOKEN cannot write repository variables.
# A fine-grained token with Variables: read and write on this repository is
# enough here; skill-coverage.yml says what else it uses it for.
on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: docs-cache
  cancel-in-progress: false

env:
  DOCS_URL: https://docs.typesafe.ai/llms-full.txt
  LATEST: ${{ vars.DOCS_LATEST }}
  REVIEWED: ${{ vars.DOCS_SKILL_REVIEWED }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.record.outputs.latest }}
      stale: ${{ steps.record.outputs.stale }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the docs
        run: |
          mkdir -p "$RUNNER_TEMP/docs"
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 \
            -o "$RUNNER_TEMP/docs/llms-full.txt" "$DOCS_URL"

      - name: Compare with the last copy
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/docs_pipeline.py compare --fetched "$RUNNER_TEMP/docs/llms-full.txt" --latest "$LATEST"

      - name: Keep this copy as an artifact
        id: upload
        if: steps.compare.outputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: typesafe-docs-${{ steps.compare.outputs.sha256 }}
          path: ${{ runner.temp }}/docs/llms-full.txt
          retention-days: 90
          if-no-files-found: error

      - name: Point the variables at it
        id: record
        env:
          VARS_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 scripts/docs_pipeline.py record-latest --latest "$LATEST" --reviewed "$REVIEWED" \
            --uploaded "${{ steps.compare.outputs.upload }}" --run-id "$GITHUB_RUN_ID" \
            --artifact-id "${{ steps.upload.outputs.artifact-id }}" \
            --sha256 "${{ steps.compare.outputs.sha256 }}" --pages "${{ steps.compare.outputs.pages }}"

  skill-coverage:
    needs: refresh
    if: needs.refresh.outputs.stale == 'true'
    uses: ./.github/workflows/skill-coverage.yml
    with:
      # The vars context was read when this run started, before refresh
      # moved DOCS_LATEST, so the new ref is passed in.
      latest: ${{ needs.refresh.outputs.latest }}
    secrets: inherit

  alert:
    needs: [refresh, skill-coverage]
    if: failure()
    uses: ./.github/workflows/failure-alert.yml
    secrets: inherit
