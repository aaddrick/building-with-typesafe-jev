name: docs cache

# Every 8 hours, fetch docs.typesafe.ai/llms-full.txt and compare it with the
# copy in upstream/typesafe-docs/. When the docs changed, commit the new copy
# to main. Then, whenever the skill was last reviewed against an older copy,
# hand off to skill-coverage.yml, which asks Claude to update the skill and
# opens a pull request.
on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-cache
  cancel-in-progress: false

env:
  DOCS_URL: https://docs.typesafe.ai/llms-full.txt
  CACHE: upstream/typesafe-docs/llms-full.txt
  SYNCED: upstream/typesafe-docs/skill-synced
  BASE: ${{ github.event.repository.default_branch }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      stale: ${{ steps.stale.outputs.stale }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The cache lives on main, whichever branch a manual run starts from.
          ref: ${{ github.event.repository.default_branch }}
          # GH_PAT lets the push through branch protection when main has it.
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the docs
        run: |
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 \
            -o "$RUNNER_TEMP/llms-full.txt" "$DOCS_URL"
          # An error page or a cut-off body must never replace the cache.
          python3 scripts/docs_diff.py validate "$RUNNER_TEMP/llms-full.txt" --against "$CACHE"

      - name: Update the cache when the docs changed
        id: refresh
        run: |
          if cmp -s "$RUNNER_TEMP/llms-full.txt" "$CACHE"; then
            echo "Docs unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/docs_diff.py report --old "$CACHE" --new "$RUNNER_TEMP/llms-full.txt" \
            | sed '/^## Diffs of changed pages/,$d' >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/llms-full.txt" "$CACHE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CACHE"
          git commit -m "Refresh the cached TypeSafe docs ($(date -u +%F))"
          for _ in 1 2 3; do
            if git push origin "HEAD:$BASE"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin "$BASE"
          done
          echo "::error::Failed to push the refreshed cache after 3 attempts"
          exit 1

      # Stale covers a change committed just now and one an earlier run
      # committed whose skill update failed or has not merged yet.
      # skill-coverage.yml skips when its open pull request already covers
      # this copy, so a stale run does not spend a Claude call twice.
      - name: Is the skill behind the cache?
        id: stale
        run: |
          if [[ "$(git hash-object "$CACHE")" == "$(tr -d '[:space:]' < "$SYNCED")" ]]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  skill-coverage:
    needs: refresh
    if: needs.refresh.outputs.stale == 'true'
    uses: ./.github/workflows/skill-coverage.yml
    secrets: inherit
