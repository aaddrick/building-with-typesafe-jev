name: skill reviewed

# When a skill-coverage pull request merges, point DOCS_SKILL_REVIEWED at the
# docs copy its description records (<!-- docs-review: REF -->), so the next
# skill-coverage run diffs from there. It never moves the variable backward.
# Needs GH_PAT with Variables: read and write.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  record:
    if: >-
      github.event.pull_request.merged
      && github.event.pull_request.head.ref == 'docs-sync/skill-coverage'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record the reviewed docs copy
        env:
          VARS_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REVIEWED: ${{ vars.DOCS_SKILL_REVIEWED }}
        run: python3 scripts/docs_pipeline.py record-merged --reviewed "$REVIEWED"

  alert:
    needs: record
    if: failure()
    uses: ./.github/workflows/failure-alert.yml
    secrets: inherit
